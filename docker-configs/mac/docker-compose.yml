version: '3.8'

x-mac-common: &mac-common
  build:
    context: ../..
    dockerfile: docker-configs/mac/Dockerfile
  # 🚨 Mac에서는 network_mode: "host" 사용 시 6080 포트 접속이 불가능해집니다.
  # 기본 네트워크를 사용해도 ROS 2 컨테이너 간 통신은 정상적으로 이루어집니다.
  shm_size: '1gb'
  # 🚨 코드를 수정할 때마다 빌드(docker-compose build)하는 방식을 쓰신다면 주석 처리하세요.
  # volumes:
  #   - ./src:/ros2_ws/src
  environment:
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    - ROS_LOCALHOST_ONLY=0
    - ROS_DOMAIN_ID=30

services:
# >>> FLEET GENERATED — gen_fleet_compose.py 가 관리한다. 직접 고치지 말 것
  # 매니페스트: config/fleet/default.yaml  (로봇 4대)
  #
  # 몸은 fleet 컨테이너의 소환기가 Webots 에 주입하고, 뇌(driver/SLAM/Nav2)는
  # 아래 컨테이너들이 담당한다.
  #
  # depends_on 에 condition: service_healthy 를 쓴다. fleet 이 "떴다"가 아니라
  # "몸을 다 확정했다"를 기다려야 하기 때문이다 — 소환기는 지난 세션의 잔여 몸을
  # 지우고 새로 만드는데, 그 전에 드라이버가 옛 몸에 붙으면 몸이 사라지는 순간
  # 드라이버가 끊기고 종료한다(ros2 launch 는 그 노드를 되살리지 않는다).
  #
  # 코어를 고정하려면 각 서비스에 cpuset 을 직접 추가한다:  cpuset: "0,1"
  ugv1:
    <<: *mac-common
    container_name: ugv1_brain_mac
    restart: unless-stopped
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=30
      - WEBOTS_HOST=host.docker.internal
      - WEBOTS_PORT=1234
      - ROBOT_ID=ugv1
      - ROBOT_INIT_X=-6.159
      - ROBOT_INIT_Y=1.263
      - ROBOT_INIT_YAW=-2.910
      - ROBOT_SYNCHRONIZATION=false
    command: >
      bash -c "source /ros2_ws/install/setup.bash &&
               ros2 launch webots_python single_ugv.launch.py"
    depends_on:
      fleet:
        condition: service_healthy

  ugv2:
    <<: *mac-common
    container_name: ugv2_brain_mac
    restart: unless-stopped
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=30
      - WEBOTS_HOST=host.docker.internal
      - WEBOTS_PORT=1234
      - ROBOT_ID=ugv2
      - ROBOT_INIT_X=8.376
      - ROBOT_INIT_Y=1.373
      - ROBOT_INIT_YAW=-0.064
      - ROBOT_SYNCHRONIZATION=false
    command: >
      bash -c "source /ros2_ws/install/setup.bash &&
               ros2 launch webots_python single_ugv.launch.py"
    depends_on:
      fleet:
        condition: service_healthy

  spot1:
    <<: *mac-common
    container_name: spot1_brain_mac
    restart: unless-stopped
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=30
      - WEBOTS_HOST=host.docker.internal
      - WEBOTS_PORT=1234
      - ROBOT_ID=spot1
      - ROBOT_INIT_X=-0.840
      - ROBOT_INIT_Y=-0.340
      - ROBOT_INIT_YAW=0.000
      - ROBOT_SYNCHRONIZATION=false
      - ROBOT_DEF=SPOT1
    command: >
      bash -c "source /ros2_ws/install/setup.bash &&
               ros2 launch webots_spot single_spot_launch.py"
    depends_on:
      fleet:
        condition: service_healthy

  drone1:
    <<: *mac-common
    container_name: drone1_brain_mac
    restart: unless-stopped
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=30
      - WEBOTS_HOST=host.docker.internal
      - WEBOTS_PORT=1234
      - ROBOT_ID=drone1
      - ROBOT_INIT_X=-6.500
      - ROBOT_INIT_Y=5.500
      - ROBOT_INIT_YAW=0.000
      - ROBOT_SYNCHRONIZATION=true
      - NAV_MODE=2.5d
    command: >
      bash -c "source /ros2_ws/install/setup.bash &&
               ros2 launch webots_python single_drone.launch.py"
    depends_on:
      fleet:
        condition: service_started
# <<< FLEET GENERATED
  # 1. 마스터 관제 컨테이너 (VNC & RViz2)
  master:
    <<: *mac-common
    container_name: rviz_master_mac
    ports:
      - "6080:6080" # 🌟 브라우저에서 localhost:6080 접속
    environment: # YAML 문법상 재정의 시 덮어쓰므로 필요한 설정을 모두 명시합니다.
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=30
      - LIBGL_ALWAYS_SOFTWARE=1 # VNC RViz2 튕김 방지
      - GALLIUM_DRIVER=llvmpipe
    # 💡 [주의] Mac에서는 VNC 환경을 먼저 띄워야 하므로 RViz2는 자동 실행하지 않습니다.
    #
    # 🗺️ 다만 맵 병합(map_merger / joint_state_filler / robot_marker_publisher)은
    #    화면이 필요 없으므로 use_rviz:=false 로 백그라운드에서 먼저 띄웁니다.
    #    이렇게 안 하면 사용자가 VNC에 접속하기 전까지 /map_merged 가 아예 안 나옵니다.
    #    (`A && B & C` 는 `(A && B) &` 를 백그라운드로 돌리고 C 를 포그라운드로 둡니다)
    #
    # localhost:6080 에 접속 후 내부 터미널에서 RViz2만 띄우면 됩니다:
    #   source /ros2_ws/install/setup.bash
    #   ros2 run rviz2 rviz2 -d /ros2_ws/install/webots_map_merge/share/webots_map_merge/rviz/master_merged.rviz
    #
    # 자세한 내용: MAP_MERGE.md
    command: >
      bash -c "source /ros2_ws/install/setup.bash &&
               ros2 launch webots_map_merge master.launch.py use_rviz:=false &
               /start_vnc.sh"
    tty: true
    stdin_open: true

  # 2. 편대 컨테이너 (fleet)
  # 🤖 소환 담당. 편대 매니페스트대로 Webots 에 **로봇의 몸을 주입**합니다.
  #    제어·경로(driver/SLAM/Nav2)는 위 로봇별 컨테이너가 담당합니다
  #    (manifest_brains:=false). 매니페스트에 없는 런타임 소환만 이 컨테이너가
  #    뇌까지 띄웁니다 — 이름과 자리가 런타임에 정해져 기다려 줄 컨테이너가 없기 때문입니다.
  #      편대 바꾸기 : 아래 command 의 fleet:= 를 바꾸고 생성기를 다시 돌리세요
  #                   docker run --rm -v ":/w" -w /w windows-master \n  #                     python3 src/webots_robot_spawner/scripts/gen_fleet_compose.py --fleet NAME
  #                   (config/fleet/ 안: default.yaml / random_squad.yaml / ugv_only.yaml)
  #      자동 소환 끔: fleet:='' 로 두면 서비스 호출만 받습니다
  #      런타임 추가 : ros2 service call /spawn_robot webots_spawner_msgs/srv/SpawnRobot "{type: 'drone', random: true}"
  # 🔁 restart 가 필요한 이유: Webots 에서 월드를 재로드(File > Reload World)하면
  #    extern 컨트롤러 연결이 끊기고 supervisor.step() 이 -1 을 돌려준다. 소환기는
  #    거기서 정상 종료하는데(월드가 사라졌으니 맞다) 그러면 컨테이너까지 끝나버려서
  #    새 월드에 다시 붙지 못한다. 실측으로 확인했다. 재시작으로 다시 붙게 한다.
  fleet:
    <<: *mac-common
    container_name: fleet_spawner_mac
    restart: unless-stopped
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=30
      # Webots가 도는 호스트. Docker Desktop for Mac은 host.docker.internal을 기본 제공합니다.
      - WEBOTS_HOST=host.docker.internal
      - WEBOTS_PORT=1234
    command: >
      bash -c "source /ros2_ws/install/setup.bash &&
               ros2 launch webots_robot_spawner spawner.launch.py fleet:=default.yaml manifest_brains:=false"
    # 🩺 소환기가 편대 몸을 다 확정하면 /tmp/fleet_ready 를 만든다. 로봇별 컨테이너는
    #    이 헬스체크가 통과할 때까지 기다린다 (condition: service_healthy).
    #    안 기다리면 드라이버가 옛 몸에 붙은 직후 그 몸이 지워져 드라이버가 죽는다.
    # 📄 편대 매니페스트만 좁게 마운트한다.
    #
    #    매니페스트는 자주 바뀌는 순수 데이터인데, 이미지에 COPY 로 들어가는 구조라
    #    한 줄 고칠 때마다 재빌드가 필요했다. 실제로 새 월드용 매니페스트를 만들고
    #    재빌드를 잊어 "편대 매니페스트를 찾을 수 없습니다" 로 소환이 통째로 실패했다.
    #    설치 경로에 정확히 겹쳐 읽기 전용으로 얹으면 컨테이너 재시작만으로 반영된다.
    #    (소스 트리 전체를 마운트하지 말라는 위 경고와 상충하지 않는다 — 빌드 산출물
    #     경로를 건드리지 않고 데이터 파일만 덮는다)
    volumes:
      - ../../src/webots_robot_spawner/config/fleet:/ros2_ws/install/webots_robot_spawner/share/webots_robot_spawner/config/fleet:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/fleet_ready"]
      interval: 3s
      timeout: 2s
      retries: 40
      start_period: 5s
