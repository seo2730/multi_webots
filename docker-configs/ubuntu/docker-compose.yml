version: '3.8'

# 🚨 [사전 준비] 우분투 호스트에서 컨테이너(root)가 X 서버에 그릴 수 있게 최초 1회(또는 재부팅 시) 허용해야 합니다:
#   xhost +local:root
# DISPLAY 환경변수는 보통 호스트 셸에 이미 설정되어 있습니다 (echo $DISPLAY 로 확인, 보통 :0 또는 :1).

# 🌉 [네트워크 모드: bridge] network_mode: host 대신 도커 기본 bridge 네트워크를 씁니다.
# host 모드로 묶으면 컨테이너와 호스트가 같은 IP로 보여서, FastRTPS가 "같은 머신"이라고 판단해
# 공유메모리(SHM) 전송을 시도합니다. 근데 컨테이너는 root, 호스트는 일반 유저라 uid가 안 맞아서
# SHM 핸드셰이크가 실패하고, 결과적으로 호스트(또는 별도 웹서버 등 외부 프로세스)에서
# ros2 topic list는 되는데 echo/hz로 실제 데이터는 못 받는 문제가 있었습니다.
# bridge로 컨테이너마다 별도 IP를 주면 FastRTPS가 "다른 머신"으로 인식해서 SHM을 안 쓰고
# UDP로만 통신하게 되어 이 문제가 해결됩니다 (실측: 호스트에서 /clock, /odom 정상 수신 확인).
networks:
  ros_bridge:
    driver: bridge

x-ros-common: &ros-common
  build:
    context: ../..
    dockerfile: docker-configs/ubuntu/Dockerfile
  networks:
    - ros_bridge
  # 🚨 ipc: host 를 쓰지 않는다. 쓰면 컨테이너들이 호스트의 /dev/shm 을 공유하는데,
  # FastDDS 참여자는 네트워크 모드와 무관하게 자기 포트용 SHM 파일
  # (/dev/shm/fastrtps_portNNNNN + _el + sem.*_mutex)을 만든다. 그래서 컨테이너를
  # 재생성할 때마다 호스트에 파일이 남아 쌓이고, 700개를 넘기자 새 참여자가
  # "fastrtps_portNNNNN: open_and_lock_file failed" 로 못 뜨는 것을 실측했다
  # (ros2 topic CLI 가 아예 안 됨).
  #
  # bridge 네트워크에서는 FastDDS 가 컨테이너를 서로 "다른 머신"으로 봐서 데이터
  # 전송에 SHM 을 쓰지 않는다. 즉 ipc: host 로 얻는 것이 없다.
  # 대신 shm_size 로 컨테이너별 /dev/shm 용량만 키운다 (mac 설정과 동일).
  shm_size: '1gb'
  pid: host
  # 🌟 host.docker.internal은 Docker Desktop(윈도우/맥) 전용 별칭이라 리눅스 Docker Engine엔 기본 등록이 안 됩니다.
  # launch 파일들이 WEBOTS_CONTROLLER_URL에서 host.docker.internal을 그대로 쓰므로, 코드 수정 없이
  # host-gateway로 별칭만 만들어 줍니다 (Docker 20.10+). bridge 모드에서도 그대로 필요합니다.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  # 🌟 리눅스 네이티브 X11은 TCP가 아니라 유닉스 소켓(/tmp/.X11-unix)을 쓰므로 반드시 볼륨으로 공유해야 합니다.
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
  # 🚨 [주의] 소스 코드 볼륨 마운트는 쓰지 마세요! Dockerfile에서 COPY로 코드를 넣고 빌드했기 때문에,
  # 여기서 다시 덮어쓰면 빌드된 파일 경로가 꼬일 수 있습니다. (코드를 수정할 때마다 docker-compose build를 다시 하는 방식이 안전합니다.)
  environment:
    - DISPLAY=${DISPLAY:-:0}
    - QT_X11_NO_MITSHM=1
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    - ROS_LOCALHOST_ONLY=0
    - ROS_DOMAIN_ID=30

    # LLM 목표 할당기용. 호스트의 NVIDIA_API_KEY 를 그대로 넘긴다.
    # 🚨 키를 이 파일에 적지 말 것 — 저장소에 올라간다.
    - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
    - GEMINI_API_KEY=${GEMINI_API_KEY:-}
services:
# >>> FLEET GENERATED — gen_fleet_compose.py 가 관리한다. 직접 고치지 말 것
  # 매니페스트: config/fleet/oneroom.yaml  (로봇 4대)
  #
  # 몸은 fleet 컨테이너의 소환기가 Webots 에 주입하고, 뇌(driver/SLAM/Nav2)는
  # 아래 컨테이너들이 담당한다.
  #
  # depends_on 에 condition: service_healthy 를 쓴다. fleet 이 "떴다"가 아니라
  # "몸을 다 확정했다"를 기다려야 하기 때문이다 — 소환기는 지난 세션의 잔여 몸을
  # 지우고 새로 만드는데, 그 전에 드라이버가 옛 몸에 붙으면 몸이 사라지는 순간
  # 드라이버가 끊기고 종료한다(ros2 launch 는 그 노드를 되살리지 않는다).
  #
  # 코어를 고정하려면 각 서비스에 cpuset 을 직접 추가한다:  cpuset: "0,1"
  ugv1:
    <<: *ros-common
    container_name: ugv1_brain_ubuntu
    restart: unless-stopped
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=30
      - WEBOTS_HOST=host.docker.internal
      - WEBOTS_PORT=1234
      - ROBOT_ID=ugv1
      - ROBOT_INIT_X=-47.750
      - ROBOT_INIT_Y=-23.250
      - ROBOT_INIT_YAW=0.000
      - ROBOT_SYNCHRONIZATION=false
    command: >
      bash -c "source /ros2_ws/install/setup.bash &&
               ros2 launch webots_python single_ugv.launch.py"
    depends_on:
      fleet:
        condition: service_healthy

  ugv2:
    <<: *ros-common
    container_name: ugv2_brain_ubuntu
    restart: unless-stopped
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=30
      - WEBOTS_HOST=host.docker.internal
      - WEBOTS_PORT=1234
      - ROBOT_ID=ugv2
      - ROBOT_INIT_X=43.750
      - ROBOT_INIT_Y=-23.750
      - ROBOT_INIT_YAW=0.000
      - ROBOT_SYNCHRONIZATION=false
    command: >
      bash -c "source /ros2_ws/install/setup.bash &&
               ros2 launch webots_python single_ugv.launch.py"
    depends_on:
      fleet:
        condition: service_healthy

  spot1:
    <<: *ros-common
    container_name: spot1_brain_ubuntu
    restart: unless-stopped
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=30
      - WEBOTS_HOST=host.docker.internal
      - WEBOTS_PORT=1234
      - ROBOT_ID=spot1
      - ROBOT_INIT_X=5.500
      - ROBOT_INIT_Y=21.000
      - ROBOT_INIT_YAW=0.000
      - ROBOT_SYNCHRONIZATION=false
      - ROBOT_DEF=SPOT1
    command: >
      bash -c "source /ros2_ws/install/setup.bash &&
               ros2 launch webots_spot single_spot_launch.py"
    depends_on:
      fleet:
        condition: service_healthy

  drone1:
    <<: *ros-common
    container_name: drone1_brain_ubuntu
    restart: unless-stopped
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=30
      - WEBOTS_HOST=host.docker.internal
      - WEBOTS_PORT=1234
      - ROBOT_ID=drone1
      - ROBOT_INIT_X=-46.250
      - ROBOT_INIT_Y=23.750
      - ROBOT_INIT_YAW=0.000
      - ROBOT_SYNCHRONIZATION=true
      - NAV_MODE=2.5d
    command: >
      bash -c "source /ros2_ws/install/setup.bash &&
               ros2 launch webots_python single_drone.launch.py"
    depends_on:
      fleet:
        condition: service_started
# <<< FLEET GENERATED
# 1. 마스터 관제 컨테이너
  master:
    <<: *ros-common
    container_name: rviz_master_ubuntu
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=30
    # 🗺️ RViz2 + 맵 병합(map_merger)을 함께 띄웁니다. 로봇별 SLAM 맵을 world
    #    프레임 기준으로 합쳐 /map_merged 로 발행합니다. (자세한 내용: 10_MAP_MERGE.md)
    command: >
      bash -c "source /ros2_ws/install/setup.bash &&
               ros2 launch webots_map_merge master.launch.py"

  # 2. 편대 컨테이너 (fleet)
  # 🤖 소환 담당. 편대 매니페스트대로 Webots 에 **로봇의 몸을 주입**합니다.
  #    제어·경로(driver/SLAM/Nav2)는 위 로봇별 컨테이너가 담당합니다
  #    (manifest_brains:=false). 매니페스트에 없는 런타임 소환만 이 컨테이너가
  #    뇌까지 띄웁니다 — 이름과 자리가 런타임에 정해져 기다려 줄 컨테이너가 없기 때문입니다.
  #      편대 바꾸기 : 아래 command 의 fleet:= 를 바꾸고 생성기를 다시 돌리세요
  #                   docker run --rm -v ":/w" -w /w windows-master \n  #                     python3 src/webots_robot_spawner/scripts/gen_fleet_compose.py --fleet NAME
  #                   (config/fleet/ 안: default.yaml / random_squad.yaml / ugv_only.yaml)
  #      자동 소환 끔: fleet:='' 로 두면 서비스 호출만 받습니다
  #      런타임 추가 : ros2 service call /spawn_robot webots_spawner_msgs/srv/SpawnRobot "{type: 'drone', random: true}"
  # 🌟 host.docker.internal 별칭은 위 x-ros-common의 extra_hosts에서 그대로 상속받습니다.
  # 🔁 restart 가 필요한 이유: Webots 에서 월드를 재로드(File > Reload World)하면
  #    extern 컨트롤러 연결이 끊기고 supervisor.step() 이 -1 을 돌려준다. 소환기는
  #    거기서 정상 종료하는데(월드가 사라졌으니 맞다) 그러면 컨테이너까지 끝나버려서
  #    새 월드에 다시 붙지 못한다. 실측으로 확인했다. 재시작으로 다시 붙게 한다.
  fleet:
    <<: *ros-common
    container_name: fleet_spawner_ubuntu
    restart: unless-stopped
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=30
      # Webots가 도는 호스트. 소환기와 소환된 로봇의 뇌가 모두 이 값을 씁니다.
      - WEBOTS_HOST=host.docker.internal
      - WEBOTS_PORT=1234
    command: >
