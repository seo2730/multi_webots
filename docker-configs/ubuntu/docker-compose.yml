    #    한 줄 고칠 때마다 재빌드가 필요했다. 실제로 새 월드용 매니페스트를 만들고
    #    재빌드를 잊어 "편대 매니페스트를 찾을 수 없습니다" 로 소환이 통째로 실패했다.
    #    설치 경로에 정확히 겹쳐 읽기 전용으로 얹으면 컨테이너 재시작만으로 반영된다.
    #    (소스 트리 전체를 마운트하지 말라는 위 경고와 상충하지 않는다 — 빌드 산출물
    #     경로를 건드리지 않고 데이터 파일만 덮는다)
    volumes:
      # ⚠️ 서비스의 volumes 는 앵커의 volumes 를 **덮어쓴다**(합쳐지지 않는다).
      #    그래서 x-ros-common 의 X11 소켓 마운트를 여기 다시 적어야 한다.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../../src/webots_robot_spawner/config/fleet:/ros2_ws/install/webots_robot_spawner/share/webots_robot_spawner/config/fleet:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/fleet_ready"]
      interval: 3s
      timeout: 2s
      retries: 40
      start_period: 5s
    depends_on:
      - master

  # 3. 탐사 할당 컨테이너 (explorer)
  # 🧭 전역 지도(/map_merged)에서 프론티어를 뽑아 **어느 로봇이 어디로 갈지** 배정한다.
  #    다중 로봇 할당은 원리적으로 중앙집중이다 — 다른 로봇이 어디로 가는지 모르면
  #    겹침을 막을 수 없다.
  #
  # 🚨 master 가 아니라 **별도 컨테이너**인 이유: master 는 맵 병합·RViz·시계라는
  #    관제 기반이고, 탐사 할당은 그 위에 얹히는 정책이라 실험 중 자주 바꿔 낀다
  #    (거리 기준 ↔ LLM). 같이 두면 전략 하나 바꾸려고 RViz 와 맵 병합까지 재시작해야
  #    하고, 할당기가 죽으면 관제까지 흔들린다.
  #
  #    strategy 가 **LLM 이 대체할 자리**다. LLM 할당이 거리 기준 베이스라인을 못 이기면
  #    증류할 것이 없다는 뜻이므로, 비교 기준을 먼저 둔다.
  #
  # 기본적으로 자동 기동하지 않는다 (profiles). 손으로 목표를 주며 실험할 때 켜져 있으면
  # 서로 덮어쓰기 때문이다. 켜려면:
  #     docker compose -f docker-configs/ubuntu/docker-compose.yml --profile explore up -d
  #
  # 전략은 환경변수로 갈아 낀다 (기본 distance):
  #     EXPLORE_STRATEGY=llm EXPLORE_DATASET=/tmp/alloc.jsonl \
  #       docker compose -f docker-configs/ubuntu/docker-compose.yml --profile explore up -d explorer
  # llm 은 위 anchor 의 NVIDIA_API_KEY 를 쓴다. 키가 없거나 응답이 스키마를
  # 어기면 매 주기 거리 베이스라인으로 물러나므로 탐사가 멈추지는 않는다.
  #
  # 탐사 범위를 좁히려면 EXPLORE_BOUNDS=x0,y0,x1,y1 (월드 좌표 m). 예: oneroom 건물 안
  #     EXPLORE_BOUNDS=-37.0,-37.0,37.0,37.0
  #
  # 증류 데이터는 기본으로 호스트 data/distill/raw/ 에 실행마다 파일 하나씩 쌓인다.
  #     EXPLORE_TAG=oneroom-in2_b1   # 파일명·meta 에 들어갈 이름표
  #     EXPLORE_DATASET=/tmp/x.jsonl # 주면 폴더 대신 이 파일 하나에 쓴다 (컨테이너 안 — down 하면 사라짐)
  explorer:
    <<: *ros-common
    container_name: explorer_ubuntu
    profiles: ["explore"]
    restart: unless-stopped
    # 🧪 증류 데이터를 호스트에 남긴다. 컨테이너 /tmp 에 쓰면 down 할 때 사라진다.
    #    실행마다 data/distill/raw/{run_id}.jsonl 하나 — 형식과 내보내기는 12장 9절.
    volumes:
      - ../../data/distill:/data/distill
    # 🚨 launch 인자는 반드시 **한 줄**로 둔다. YAML 접힘 스칼라(>)는 더 깊게 들여쓴
    #    줄의 줄바꿈을 보존하므로, 인자를 줄바꿈해 적으면 bash 가 `ros2 launch` 를
    #    인자 없이 실행하고 `strategy:=llm` 을 별도 명령으로 취급한다.
    #    (실측: 노드가 조용히 기본값 distance/30초로 떴다 — 에러가 안 난다)
    # 🚨 값이 빈 인자(`name:=`)도 안 된다. ros2 launch 가 "malformed launch argument" 로
    #    거부하고 컨테이너가 재시작을 반복한다. 그래서 선택 인자의 기본값은 빈 값이 아니라
    #    none 이고, 할당기가 none 을 "안 줌" 으로 읽는다.
    command: >
      bash -c "source /ros2_ws/install/setup.bash &&
               ros2 launch webots_goal_bridge allocator.launch.py strategy:=${EXPLORE_STRATEGY:-distance} period:=${EXPLORE_PERIOD:-30.0} min_separation:=${EXPLORE_MIN_SEP:-15.0} dataset_path:=${EXPLORE_DATASET:-none} explore_bounds:=${EXPLORE_BOUNDS:-none} dataset_dir:=${EXPLORE_DATASET_DIR:-/data/distill/raw} run_tag:=${EXPLORE_TAG:-none}"
    depends_on:
      - master
