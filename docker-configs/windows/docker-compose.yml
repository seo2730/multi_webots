version: '3.8'

# 🌉 [네트워크 모드: bridge] network_mode: host 대신 도커 기본 bridge 네트워크를 씁니다.
# Docker Desktop for Windows는 host 모드를 줘도 실제 Windows 네트워크가 아니라
# Docker Desktop 내부 VM 네트워크(예: 192.168.65.x)에 격리되어, Windows(크롬 등)에서
# 컨테이너 포트로 접속이 아예 안 되는 문제가 있었습니다 (실측 확인).
# bridge + 명시적 ports publish 조합은 Docker Desktop이 자동으로 localhost 포워딩을
# 해주기 때문에 이 문제가 해결됩니다.
networks:
  ros_bridge:
    driver: bridge

x-ros-common: &ros-common
  build:
    context: ../..
    dockerfile: docker-configs/windows/Dockerfile
  networks:
    - ros_bridge
  # 🚨 ipc: host 를 쓰지 않는다. 쓰면 컨테이너들이 호스트의 /dev/shm 을 공유하는데,
  # FastDDS 참여자는 네트워크 모드와 무관하게 자기 포트용 SHM 파일
  # (/dev/shm/fastrtps_portNNNNN + _el + sem.*_mutex)을 만든다. 그래서 컨테이너를
  # 재생성할 때마다 호스트에 파일이 남아 쌓이고, 700개를 넘기자 새 참여자가
  # "fastrtps_portNNNNN: open_and_lock_file failed" 로 못 뜨는 것을 실측했다
  # (ros2 topic CLI 가 아예 안 됨).
  #
  # bridge 네트워크에서는 FastDDS 가 컨테이너를 서로 "다른 머신"으로 봐서 데이터
  # 전송에 SHM 을 쓰지 않는다. 즉 ipc: host 로 얻는 것이 없다.
  # 대신 shm_size 로 컨테이너별 /dev/shm 용량만 키운다 (mac 설정과 동일).
  shm_size: '1gb'
  pid: host
  # 🚨 [주의] volumes 마운트를 제거하거나 주석 처리하세요!
  # Dockerfile에서 COPY로 코드를 넣고 빌드했기 때문에, 여기서 다시 덮어쓰면
  # 빌드된 파일 경로가 꼬일 수 있습니다. (코드를 수정할 때마다 docker-compose build를 다시 하는 방식이 안전합니다.)
  # volumes:
  #   - .:/ros2_ws/src/multi_webots
  environment:
    - DISPLAY=${DISPLAY:-host.docker.internal:0}
    - QT_X11_NO_MITSHM=1
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    - ROS_LOCALHOST_ONLY=0
    - ROS_DOMAIN_ID=30

services:
# >>> FLEET GENERATED — gen_fleet_compose.py 가 관리한다. 직접 고치지 말 것
  # 매니페스트: config/fleet/default.yaml  (로봇 4대)
  #
  # 몸은 fleet 컨테이너의 소환기가 Webots 에 주입하고, 뇌(driver/SLAM/Nav2)는
  # 아래 컨테이너들이 담당한다.
  #
  # depends_on 에 condition: service_healthy 를 쓴다. fleet 이 "떴다"가 아니라
  # "몸을 다 확정했다"를 기다려야 하기 때문이다 — 소환기는 지난 세션의 잔여 몸을
  # 지우고 새로 만드는데, 그 전에 드라이버가 옛 몸에 붙으면 몸이 사라지는 순간
  # 드라이버가 끊기고 종료한다(ros2 launch 는 그 노드를 되살리지 않는다).
  #
  # 코어를 고정하려면 각 서비스에 cpuset 을 직접 추가한다:  cpuset: "0,1"
  ugv1:
    <<: *ros-common
    container_name: ugv1_brain_windows
    restart: unless-stopped
    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=30
      - WEBOTS_HOST=host.docker.internal
      - WEBOTS_PORT=1234
      - ROBOT_ID=ugv1
      - ROBOT_INIT_X=-6.159
      - ROBOT_INIT_Y=1.263
      - ROBOT_INIT_YAW=-2.910
      - ROBOT_SYNCHRONIZATION=false
    command: >
      bash -c "source /ros2_ws/install/setup.bash &&
               ros2 launch webots_python single_ugv.launch.py"
    depends_on:
      fleet:
        condition: service_healthy

  ugv2:
    <<: *ros-common
    container_name: ugv2_brain_windows
    restart: unless-stopped
    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=30
      - WEBOTS_HOST=host.docker.internal
      - WEBOTS_PORT=1234
      - ROBOT_ID=ugv2
      - ROBOT_INIT_X=8.376
      - ROBOT_INIT_Y=1.373
      - ROBOT_INIT_YAW=-0.064
      - ROBOT_SYNCHRONIZATION=false
    command: >
      bash -c "source /ros2_ws/install/setup.bash &&
               ros2 launch webots_python single_ugv.launch.py"
    depends_on:
      fleet:
        condition: service_healthy

  spot1:
    <<: *ros-common
    container_name: spot1_brain_windows
    restart: unless-stopped
    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=30
      - WEBOTS_HOST=host.docker.internal
      - WEBOTS_PORT=1234
      - ROBOT_ID=spot1
      - ROBOT_INIT_X=-0.840
      - ROBOT_INIT_Y=-0.340
      - ROBOT_INIT_YAW=0.000
      - ROBOT_SYNCHRONIZATION=false
      - ROBOT_DEF=SPOT1
    command: >
      bash -c "source /ros2_ws/install/setup.bash &&
               ros2 launch webots_spot single_spot_launch.py"
    depends_on:
      fleet:
        condition: service_healthy

  drone1:
    <<: *ros-common
    container_name: drone1_brain_windows
    restart: unless-stopped
    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=30
      - WEBOTS_HOST=host.docker.internal
      - WEBOTS_PORT=1234
      - ROBOT_ID=drone1
      - ROBOT_INIT_X=-6.500
      - ROBOT_INIT_Y=5.500
      - ROBOT_INIT_YAW=0.000
      - ROBOT_SYNCHRONIZATION=true
    command: >
      bash -c "source /ros2_ws/install/setup.bash &&
               ros2 launch webots_python single_drone.launch.py"
    depends_on:
      fleet:
        condition: service_started
# <<< FLEET GENERATED
# 1. 마스터 관제 컨테이너
  master:
    <<: *ros-common
    container_name: rviz_master_windows
    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0}
      - ROS_DOMAIN_ID=30
    # 🌟 [수정] 실행 전에 반드시 환경(setup.bash)을 먼저 로드(source)합니다!
    # 🗺️ RViz2 + 맵 병합(map_merger)을 함께 띄웁니다. 로봇별 SLAM 맵을 world
    #    프레임 기준으로 합쳐 /map_merged 로 발행합니다. (자세한 내용: MAP_MERGE.md)
    command: >
      bash -c "source /ros2_ws/install/setup.bash &&
               ros2 launch webots_map_merge master.launch.py"

  # 2. 편대 컨테이너 (fleet)
  # 🤖 소환 담당. 편대 매니페스트대로 Webots 에 **로봇의 몸을 주입**합니다.
  #    제어·경로(driver/SLAM/Nav2)는 위 로봇별 컨테이너가 담당합니다
  #    (manifest_brains:=false). 매니페스트에 없는 런타임 소환만 이 컨테이너가
  #    뇌까지 띄웁니다 — 이름과 자리가 런타임에 정해져 기다려 줄 컨테이너가 없기 때문입니다.
  #      편대 바꾸기 : 아래 command 의 fleet:= 를 바꾸고 생성기를 다시 돌리세요
  #                   docker run --rm -v ":/w" -w /w windows-master \n  #                     python3 src/webots_robot_spawner/scripts/gen_fleet_compose.py --fleet NAME
  #                   (config/fleet/ 안: default.yaml / random_squad.yaml / ugv_only.yaml)
  #      자동 소환 끔: fleet:='' 로 두면 서비스 호출만 받습니다
  #      런타임 추가 : ros2 service call /spawn_robot webots_spawner_msgs/srv/SpawnRobot "{type: 'drone', random: true}"
  # 🔁 restart 가 필요한 이유: Webots 에서 월드를 재로드(File > Reload World)하면
  #    extern 컨트롤러 연결이 끊기고 supervisor.step() 이 -1 을 돌려준다. 소환기는
  #    거기서 정상 종료하는데(월드가 사라졌으니 맞다) 그러면 컨테이너까지 끝나버려서
  #    새 월드에 다시 붙지 못한다. 실측으로 확인했다. 재시작으로 다시 붙게 한다.
  fleet:
    <<: *ros-common
    container_name: fleet_spawner_windows
    restart: unless-stopped
    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=30
      # Webots가 도는 호스트. 소환기와 소환된 로봇의 뇌가 모두 이 값을 씁니다.
      - WEBOTS_HOST=host.docker.internal
      - WEBOTS_PORT=1234
    command: >
      bash -c "source /ros2_ws/install/setup.bash &&
               ros2 launch webots_robot_spawner spawner.launch.py fleet:=default.yaml manifest_brains:=false"
    # 🩺 소환기가 편대 몸을 다 확정하면 /tmp/fleet_ready 를 만든다. 로봇별 컨테이너는
    #    이 헬스체크가 통과할 때까지 기다린다 (condition: service_healthy).
    #    안 기다리면 드라이버가 옛 몸에 붙은 직후 그 몸이 지워져 드라이버가 죽는다.
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/fleet_ready"]
      interval: 3s
      timeout: 2s
      retries: 40
      start_period: 5s
    depends_on:
      - master
