# 기본 편대 — 예전에 my_world.wbt 에 박혀 있던 그 4대다.
#
# 좌표는 원래 월드 파일의 스폰 위치를 그대로 옮긴 것이라, 이 매니페스트로 띄우면
# 예전과 똑같은 배치가 된다. 다른 점은 **이제 이게 데이터라는 것**이다.
# 4대를 쓰고 싶지 않으면 이 파일을 고르지 않으면 된다.
#
#   ros2 launch webots_robot_spawner spawner.launch.py fleet:=random_squad.yaml
#   ros2 launch webots_robot_spawner spawner.launch.py fleet:=''   # 자동 소환 없음

fleet:
  - {type: ugv,   id: ugv1,   x: -6.159, y: 1.263, yaw: -2.910}
  - {type: ugv,   id: ugv2,   x: 8.376,  y: 1.373, yaw: -0.064}
  - {type: spot,  id: spot1,  x: -0.840, y: -0.340, yaw: 0.0}
  - {type: drone, id: drone1, x: -6.500, y: 5.500, yaw: 0.0}

# 위 4대는 좌표를 지정하므로 spawn_area 가 쓰이지 않는다. random 항목을 섞어 쓸 때만
# 쓰이며, 그때 무작위 배치는 항상 이 영역 안에서 이루어진다.
# 값은 my_world.wbt 의 사물 배치 범위(x -9.6~9.5, y -6.9~8.0)에서 여유를 둔 것이다.
spawn_area: [-9.0, -6.0, 9.0, 7.0]
